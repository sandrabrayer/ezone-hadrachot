<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>מעקב הדרכות | E-ZONE איזון</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
/* Two-tone warm theme: a soft GOLD page background with warm-brown cards
   sitting on it. Dark warm ink on gold, light ink on brown. Deep saturated
   red for alerts, orange for warnings, gold for primary actions. RTL. */
:root{
  --bg:#E3C078;              /* soft gold page background */
  --bg-surface:#4A3728;      /* warm brown cards and rows */
  --bg-elevated:#5C4735;
  --field-bg:#3A2A1C;        /* inputs inside brown cards */
  --ink:#FFF9F0;             /* text ON BROWN */
  --ink-soft:#F1E3D1;
  --muted:#D2BAA1;           /* secondary text ON BROWN */
  --ink-page:#3A2712;        /* text ON GOLD */
  --muted-page:#5D451F;      /* secondary text ON GOLD */
  --line:rgba(255,238,214,0.16);        /* separators INSIDE cards */
  --line-strong:rgba(255,238,214,0.30);
  --card-edge:rgba(58,38,16,0.45);      /* card border against the gold page */
  --gold-1:#EDB44A;          /* primary gradient — darkened to stand out on gold */
  --gold-2:#C8821E;
  --gold-border:#8F5F10;
  --gold-soft:rgba(224,161,57,0.22);
  --gold-deep:#3A2604;
  --gold-page-text:#7A5306;  /* gold-family headings on the gold page */
  --orange:#F0904B;
  --orange-soft:rgba(240,144,75,0.24);
  --success:#82D2A0;
  --success-soft:rgba(130,210,160,0.20);
  --warning:#F0904B;
  --danger:#C1271A;          /* deep saturated red — fills */
  --danger-deep:#8F1207;     /* red text on the gold page */
  --danger-ink:#FFF6F2;      /* near-white text inside red fills */
  --danger-on-card:#FF9585;  /* red-family text on brown surfaces */
  --danger-soft:rgba(193,39,26,0.28);   /* overdue row tint on brown */
  --grad:linear-gradient(90deg,var(--gold-1),var(--gold-2));
}
body{
  font-family:'Heebo',sans-serif;
  direction:rtl;
  background:var(--bg);
  color:var(--ink-page);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:60px;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* Topbar */
.topbar{
  background:#2F2213;
  color:var(--ink);
  padding:16px 0;
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid rgba(58,38,16,.5);
}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand-name{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:18px;white-space:nowrap}
.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nav button{
  background:transparent;border:1px solid var(--line-strong);color:var(--ink-soft);
  padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:.15s;
}
.nav button:hover{background:var(--bg-elevated);color:var(--ink)}
.nav button.on{background:var(--grad);color:var(--gold-deep);border-color:transparent}
.logout{background:transparent;border:none;color:var(--muted);padding:8px 12px;border-radius:999px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
.logout:hover{color:var(--ink);background:var(--bg-elevated)}

/* Login — a brown card on the gold page */
.login{max-width:360px;margin:12vh auto 0;padding:34px 28px;background:var(--bg-surface);color:var(--ink);border:1px solid var(--card-edge);border-radius:18px;text-align:center}
.login h1{font-family:'Frank Ruhl Libre',serif;font-size:24px;margin-bottom:6px}
.login p{color:var(--muted);font-size:13px;margin-bottom:22px}
.login input{
  width:100%;padding:13px;border-radius:12px;border:1px solid var(--line-strong);
  background:var(--field-bg);color:var(--ink);font-size:22px;text-align:center;letter-spacing:8px;
  font-family:inherit;direction:ltr;
}
.login input:focus{outline:none;border-color:var(--gold-2)}
.login button{width:100%;margin-top:14px;padding:13px;border-radius:12px;border:1px solid var(--gold-border);background:var(--grad);color:var(--gold-deep);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.login .err{color:var(--danger-on-card);font-size:13px;margin-top:12px;min-height:18px}

/* Summary bar — dark ink on the gold page, brown chips */
.summary{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0 18px}
.summary .qtitle{font-family:'Frank Ruhl Libre',serif;font-size:22px;font-weight:700}
.pill{background:var(--bg-surface);border:1px solid var(--card-edge);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--ink-soft)}
.pill b{color:var(--ink)}
.pill.bad{background:var(--danger);border-color:var(--danger-deep);color:var(--danger-ink)}
.pill.bad b{color:var(--danger-ink)}
.pill.firstmonth{border-color:var(--orange);color:var(--orange)}
.grow{flex:1}
.btn{
  border:none;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:700;
  font-family:inherit;cursor:pointer;transition:.15s;
}
.btn.primary{background:var(--grad);color:var(--gold-deep);border:1px solid var(--gold-border);box-shadow:0 1px 3px rgba(58,38,4,.35)}
.btn.primary:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--ink-soft)}
.btn.ghost:hover{color:var(--ink);background:var(--bg-elevated)}
.btn.small{padding:7px 12px;font-size:12px;border-radius:9px}
.btn.done{background:var(--success);color:#0B2415}
.btn.danger-ghost{background:transparent;border:1px solid var(--line-strong);color:var(--muted)}
.btn.danger-ghost:hover{color:var(--danger-on-card);border-color:var(--danger-on-card)}

/* Sections — headings on gold, brown cards */
.section{margin-bottom:26px}
.section h2{font-size:15px;font-weight:700;color:var(--ink-page);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section h2 .count{color:var(--muted-page);font-weight:500;font-size:13px}
.card{background:var(--bg-surface);color:var(--ink);border:1px solid var(--card-edge);border-radius:14px;overflow:hidden}
.section.alert .card{border-color:var(--danger)}
.section.alert h2{color:var(--danger-deep)}
.section.groups h2{color:var(--gold-page-text)}
.section.groups .card{border-color:var(--gold-border)}

/* People rows */
.row{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 16px;border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none}
.row.overdue{background:var(--danger-soft)}
.gname{font-weight:600;font-size:14px;min-width:140px}
.gsub{color:var(--muted);font-size:12px}
.due{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.due b{color:var(--ink)}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.badge.role{background:var(--bg-elevated);color:var(--ink-soft)}
.badge.new{background:var(--orange-soft);color:var(--orange)}
.badge.overdue{background:var(--danger);color:var(--danger-ink)}
.badge.refresher{background:var(--gold-soft);color:var(--gold-1)}
.badge.planned{background:var(--bg-elevated);color:var(--ink-soft)}
.badge.done{background:var(--success-soft);color:var(--success)}
.badge.none{background:var(--bg-elevated);color:var(--muted)}
.badge.inactive{background:var(--bg-elevated);color:var(--muted)}
.row select,.row input[type=date]{
  background:var(--field-bg);border:1px solid var(--line-strong);color:var(--ink);
  border-radius:9px;padding:6px 8px;font-size:12px;font-family:inherit;
}
.row select:focus,.row input:focus{outline:none;border-color:var(--gold-2)}
.spacer{flex:1}
.rowactions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* Group session cards */
.gsession{padding:14px 16px;border-bottom:1px solid var(--line)}
.gsession:last-child{border-bottom:none}
.gsession .ghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.gsession .gtitle{font-weight:700;font-size:14px;color:var(--gold-1)}
.attend{display:flex;flex-wrap:wrap;gap:8px}
.attend label{
  display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft);
  border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;cursor:pointer;
}
.attend label.on{background:var(--gold-soft);border-color:var(--gold-2);color:var(--gold-1)}
.attend input{display:none}

/* Banner — sits directly on the gold page */
.banner{border-radius:14px;padding:14px 18px;margin:18px 0;font-size:14px;border:1px solid}
.banner.error{background:var(--danger);border-color:var(--danger-deep);color:var(--danger-ink)}
.banner.info{background:var(--bg-surface);border-color:var(--gold-border);color:var(--ink)}

/* Supervisors */
.suptable{width:100%}
.suprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.suprow:last-child{border-bottom:none}
.suprow.off{opacity:.55}
.supname{font-weight:600;min-width:130px}
.suphouses{color:var(--muted);font-size:12px;flex:1;min-width:160px}
.supcaps{display:flex;gap:6px;flex-wrap:wrap}

/* Forms and modal */
.overlay{position:fixed;inset:0;background:rgba(46,32,16,.62);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:8vh 16px}
.overlay.open{display:flex}
.modal{background:var(--bg-surface);color:var(--ink);border:1px solid var(--card-edge);border-radius:16px;padding:24px;width:100%;max-width:460px;max-height:80vh;overflow:auto}
.modal h3{font-size:17px;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input[type=text],.field input[type=number],.field input[type=date],.field select{
  width:100%;background:var(--field-bg);border:1px solid var(--line-strong);color:var(--ink);
  border-radius:10px;padding:10px;font-size:14px;font-family:inherit;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold-2)}
.houseboxes{display:flex;flex-wrap:wrap;gap:8px}
.houseboxes label{
  display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft);
  border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;cursor:pointer;
}
.houseboxes label.on{background:var(--gold-soft);border-color:var(--gold-2);color:var(--gold-1)}
.houseboxes input{display:none}
.modal .actions{display:flex;gap:10px;justify-content:flex-start;margin-top:20px}
.preview-list{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:10px 0}
.preview-list .pitem{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.preview-list .pitem:last-child{border-bottom:none}
.preview-list .pmeta{color:var(--muted);font-size:12px}
.toast{
  position:fixed;bottom:22px;right:50%;transform:translateX(50%);
  background:var(--bg-elevated);border:1px solid var(--card-edge);color:var(--ink);
  border-radius:12px;padding:12px 22px;font-size:14px;z-index:200;display:none;
}
.toast.show{display:block}
/* Loading text: dark on the gold page, light inside brown cards */
.loading{color:var(--muted-page);text-align:center;padding:50px 0;font-size:14px}
.card .loading{color:var(--muted)}
@media (max-width:640px){
  .gname{min-width:100%}
  .rowactions{width:100%;justify-content:flex-start}
}
</style>
</head>
<body>

<!-- ===== Login ===== -->
<div id="loginView" class="login" style="display:none">
  <h1>מעקב הדרכות</h1>
  <p>הקלידי קוד גישה כדי להמשיך</p>
  <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••"/>
  <button id="loginBtn">כניסה</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- ===== App ===== -->
<div id="appView" style="display:none">
  <div class="topbar">
    <div class="wrap">
      <span class="brand-name">E-ZONE · מעקב הדרכות</span>
      <div class="nav">
        <button data-view="board" class="on">צוות</button>
        <button data-view="supervisors">מנחים</button>
        <button class="logout" id="logoutBtn">יציאה</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div id="errorBanner" class="banner error" style="display:none"></div>

    <!-- ===== Board view ===== -->
    <div id="boardView">
      <div class="summary">
        <span class="qtitle">הדרכות לפי תפקיד</span>
        <span class="pill" id="totalPill"></span>
        <span class="pill firstmonth" id="firstMonthPill" style="display:none"></span>
        <span class="pill bad" id="overduePill" style="display:none"></span>
        <span class="grow"></span>
        <button class="btn primary" id="scheduleBtn">שבץ הדרכות</button>
      </div>
      <div id="boardContent" class="loading">טוען נתונים…</div>
    </div>

    <!-- ===== Supervisors view ===== -->
    <div id="supervisorsView" style="display:none">
      <div class="summary">
        <span class="qtitle">מנחים</span>
        <span class="grow"></span>
        <button class="btn primary" id="addSupBtn">הוספת מנחה</button>
      </div>
      <div class="card suptable" id="supList"></div>
    </div>
  </div>
</div>

<!-- ===== Complete modal ===== -->
<div class="overlay" id="completeOverlay">
  <div class="modal">
    <h3>סימון הדרכה כבוצעה</h3>
    <div class="gsub" id="completeWho" style="margin-bottom:14px"></div>
    <div class="field">
      <label>תאריך ביצוע</label>
      <input type="date" id="completeDate"/>
    </div>
    <div class="actions">
      <button class="btn done" id="completeConfirm">בוצע</button>
      <button class="btn ghost" data-close>ביטול</button>
    </div>
  </div>
</div>

<!-- ===== Schedule preview modal ===== -->
<div class="overlay" id="scheduleOverlay">
  <div class="modal">
    <h3>שיבוץ הדרכות</h3>
    <div class="gsub" id="scheduleSummary"></div>
    <div class="preview-list" id="schedulePreview"></div>
    <div class="gsub" id="scheduleUnassigned" style="color:var(--danger-on-card)"></div>
    <div class="actions">
      <button class="btn primary" id="scheduleConfirm">אישור שיבוץ</button>
      <button class="btn ghost" data-close>ביטול</button>
    </div>
  </div>
</div>

<!-- ===== Supervisor modal ===== -->
<div class="overlay" id="supOverlay">
  <div class="modal">
    <h3 id="supModalTitle">הוספת מנחה</h3>
    <div class="field">
      <label>שם</label>
      <input type="text" id="supName" maxlength="80"/>
    </div>
    <div class="field">
      <label>בתים באחריות</label>
      <div class="houseboxes" id="supHouses"></div>
    </div>
    <div class="field">
      <label>סוגי הדרכה</label>
      <div class="houseboxes" id="supCaps"></div>
    </div>
    <div class="field">
      <label>תפקידים בהנחיה</label>
      <div class="houseboxes" id="supRoles"></div>
    </div>
    <div class="field">
      <label>מקסימום הדרכות ברבעון</label>
      <input type="number" id="supMax" min="1" max="500" value="10"/>
    </div>
    <div class="actions">
      <button class="btn primary" id="supSave">שמירה</button>
      <button class="btn ghost" data-close>ביטול</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/lib/scheduler.js"></script>
<script>
'use strict';
/* All cadence, compliance and scheduling logic runs HERE in the browser via
   lib/scheduler.js — the backend only stores and returns raw rows. */

const L = window.HadrachotLogic;

const HOUSES = [
  { id: 'ramot',       name: 'רמות השבים' },
  { id: 'asher',       name: 'רעננה אשר' },
  { id: 'ofroni',      name: 'קיסריה עפרוני' },
  { id: 'rehab',       name: 'קיסריה ריהאב' },
  { id: 'pardes',      name: 'רעננה הפרדס' },
  { id: 'sde_eliezer', name: 'שדה אליעזר' },
  { id: 'hq',          name: 'מטה' },
];
const HOUSE_NAME = {};
HOUSES.forEach(h => HOUSE_NAME[h.id] = h.name);

const CLUSTER_LABEL = { kesaria: 'קיסריה', raanana: 'רעננה' };
const ROLE_LABEL = {
  guide: 'מדריך',
  social_worker: 'עובד סוציאלי',
  house_manager: 'מנהל בית',
  coordinator: 'רכז',
};
const ROLE_LABEL_PLURAL = {
  guide: 'מדריכים',
  social_worker: 'עובדים סוציאליים',
  house_manager: 'מנהלי בתים',
  coordinator: 'רכזים',
};

// ---- state ----
let token = localStorage.getItem('hadrachot_token') || '';
let people = null;      // live from the staffing feed, null until loaded
let sessions = [];
let supervisors = [];
let currentView = 'board';
let editingSupId = null;
let completingCtx = null; // { hadrachaId } or { direct } for direct completion

function todayStr() {
  const d = new Date();
  const p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

// ---- api ----
async function api(path, opts) {
  const init = Object.assign({ headers: {} }, opts || {});
  init.headers['Authorization'] = 'Bearer ' + token;
  if (init.body) init.headers['Content-Type'] = 'application/json';
  const resp = await fetch(path, init);
  if (resp.status === 401) { logout(); throw new Error('unauthorized'); }
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(body.error || 'שגיאה בשרת');
  return body;
}

function action(payload) {
  return api('/api/action', { method: 'POST', body: JSON.stringify(payload) });
}

// ---- auth ----
function logout() {
  token = '';
  localStorage.removeItem('hadrachot_token');
  document.getElementById('appView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('pinInput').value = '';
  document.getElementById('pinInput').focus();
}

async function login() {
  const pin = document.getElementById('pinInput').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin }),
    });
    const body = await resp.json().catch(() => ({}));
    if (!resp.ok) { errEl.textContent = body.error || 'קוד שגוי'; return; }
    token = body.token;
    localStorage.setItem('hadrachot_token', token);
    enterApp();
  } catch (e) {
    errEl.textContent = 'שגיאת תקשורת. נסי שוב.';
  }
}

function enterApp() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  refresh();
}

// ---- data loading ----
async function refresh() {
  const banner = document.getElementById('errorBanner');
  banner.style.display = 'none';
  document.getElementById('boardContent').innerHTML = '<div class="loading">טוען נתונים…</div>';
  try {
    // People come from the staffing app — fail-closed: on any error the
    // board is NOT rendered, so an empty roster can never look compliant.
    const [guidesResp, dataResp] = await Promise.all([
      api('/api/guides'),
      api('/api/data'),
    ]);
    people = guidesResp.guides || [];
    sessions = dataResp.hadrachot || [];
    supervisors = dataResp.supervisors || [];
    render();
  } catch (e) {
    if (e.message === 'unauthorized') return;
    people = null;
    banner.textContent = 'לא ניתן לטעון נתונים כרגע: ' + e.message + '. רשימת אנשי הצוות מגיעה ישירות מהמערכת הראשית — בלעדיה אין תצוגה.';
    banner.style.display = 'block';
    document.getElementById('boardContent').innerHTML = '';
    renderSupervisors();
  }
}

// Refresh only the sheet-backed data after a write; people stay as loaded.
async function refreshData() {
  const dataResp = await api('/api/data');
  sessions = dataResp.hadrachot || [];
  supervisors = dataResp.supervisors || [];
  render();
}

// ---- rendering ----
function render() {
  renderBoard();
  renderSupervisors();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function heDate(d) {
  if (!L.isValidDate(d)) return '';
  return d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4);
}

// One board entry per person per role.
function boardEntries() {
  const today = todayStr();
  const seen = {};
  const entries = [];
  (people || []).forEach(p => {
    const name = L.normalizeGuideName(p.name);
    if (!name) return;
    const role = L.normalizeRole(p.role);
    const key = name + '|' + role;
    if (seen[key]) return;
    seen[key] = true;
    const st = L.personStatus(p, sessions, today);
    entries.push({ person: p, name, role, st });
  });
  return entries;
}

function supervisorName(id) {
  const s = supervisors.find(x => x.id === id);
  return s ? s.name : '';
}

function renderBoard() {
  if (people === null) return; // load failed — banner already shown

  const entries = boardEntries();
  const activeEntries = entries.filter(e => e.person.active !== false);
  const overdueEntries = activeEntries.filter(e => e.st.overdue || e.st.refresherOverdue);
  const firstMonthCount = activeEntries.filter(e => e.st.firstMonth).length;

  document.getElementById('totalPill').innerHTML =
    'אנשי צוות פעילים: <b>' + activeEntries.length + '</b>';
  const fp = document.getElementById('firstMonthPill');
  if (firstMonthCount) {
    fp.style.display = '';
    fp.innerHTML = 'בחודש הראשון: <b>' + firstMonthCount + '</b>';
  } else fp.style.display = 'none';
  const op = document.getElementById('overduePill');
  if (overdueEntries.length) {
    op.style.display = '';
    op.innerHTML = 'באיחור: <b>' + overdueEntries.length + '</b>';
  } else op.style.display = 'none';

  let html = '';

  // Overdue first — the whole point of the board.
  if (overdueEntries.length) {
    const sorted = overdueEntries.slice().sort((a, b) => b.st.daysOverdue - a.st.daysOverdue);
    html += '<div class="section alert"><h2>דורש טיפול מיידי <span class="count">' +
      overdueEntries.length + '</span></h2><div class="card">';
    sorted.forEach(e => { html += personRow(e, true); });
    html += '</div></div>';
  }

  html += groupSessionsSection(entries);

  HOUSES.forEach(h => {
    const inHouse = entries.filter(e => e.person.house === h.id);
    if (!inHouse.length) return;
    // Overdue first inside each house, then by next-due date.
    const sorted = inHouse.slice().sort((a, b) => {
      const ao = a.st.overdue || a.st.refresherOverdue ? 0 : 1;
      const bo = b.st.overdue || b.st.refresherOverdue ? 0 : 1;
      if (ao !== bo) return ao - bo;
      return String(a.st.nextDue || '9999').localeCompare(String(b.st.nextDue || '9999'));
    });
    html += '<div class="section"><h2>' + esc(h.name) + ' <span class="count">' +
      inHouse.length + '</span></h2><div class="card">';
    sorted.forEach(e => { html += personRow(e, false); });
    html += '</div></div>';
  });

  if (!html) html = '<div class="loading">אין אנשי צוות להצגה</div>';
  document.getElementById('boardContent').innerHTML = html;
  bindBoardEvents();
}

function personRow(entry, inAlert) {
  const p = entry.person;
  const st = entry.st;
  const inactive = p.active === false;
  const planned = st.planned;

  let badges = '<span class="badge role">' + esc(ROLE_LABEL[entry.role] || entry.role) + '</span>';
  if (inactive) badges += '<span class="badge inactive">לא פעיל</span>';
  if (st.firstMonth) {
    badges += '<span class="badge new">חודש ראשון · עד ' + heDate(st.deadline || st.nextDue) + '</span>';
  }
  if (st.overdue && !inAlert) badges += '<span class="badge overdue">באיחור</span>';
  if (st.refresherOverdue) badges += '<span class="badge overdue">רענון באיחור</span>';

  // Next-due and days-overdue — the per-person compliance line.
  let due = '';
  if (st.overdue) {
    due = '<span class="due">הדרכה עד <b>' + heDate(st.nextDue) + '</b> · באיחור <b>' +
      st.daysOverdue + '</b> ימים</span>';
  } else if (st.nextDue) {
    due = '<span class="due">הבאה עד <b>' + heDate(st.nextDue) + '</b></span>';
  }
  if (st.lastDone) {
    due += '<span class="gsub">אחרונה ' + heDate(st.lastDone) + '</span>';
  }

  let details = '';
  let controls = '';

  if (planned && L.sessionTypeOf(planned) === 'individual') {
    const supOptions = supervisorOptions(planned.supervisorId, p.house, entry.role, false);
    details =
      '<select data-act="supervisor" data-id="' + esc(planned.id) + '">' + supOptions + '</select>' +
      '<input type="date" value="' + esc(planned.scheduledDate || '') +
      '" data-act="reschedule" data-id="' + esc(planned.id) + '"/>';
    controls =
      '<button class="btn small done" data-act="complete" data-id="' + esc(planned.id) +
      '" data-name="' + esc(entry.name) + '">בוצע</button>' +
      '<button class="btn small danger-ghost" data-act="cancel" data-id="' + esc(planned.id) + '">ביטול</button>';
  } else if (planned && L.sessionTypeOf(planned) === 'group') {
    details = '<span class="badge planned">קבוצתית · ' +
      esc(CLUSTER_LABEL[planned.cluster] || planned.cluster) +
      (planned.scheduledDate ? ' · ' + heDate(planned.scheduledDate) : '') + '</span>';
  } else if (!inactive) {
    // Nothing planned — manual single assignment or direct completion.
    details = '<select data-act="assign" data-name="' + esc(entry.name) +
      '" data-house="' + esc(p.house) + '"><option value="">שיבוץ ידני…</option>' +
      supervisorOptions('', p.house, entry.role, true) + '</select>';
    controls = '<button class="btn small done" data-act="complete-direct" data-name="' +
      esc(entry.name) + '" data-house="' + esc(p.house) + '">בוצע</button>';
  }

  // The refresher track — guides only.
  if (st.plannedRefresher) {
    details += '<span class="badge refresher">רענון · ' +
      heDate(st.plannedRefresher.scheduledDate) + '</span>';
    controls += '<button class="btn small ghost" data-act="complete" data-id="' +
      esc(st.plannedRefresher.id) + '" data-name="' + esc(entry.name) + ' · רענון">רענון בוצע</button>';
  } else if (st.nextRefresherDue && !st.refresherOverdue && entry.role === 'guide') {
    details += '<span class="gsub">רענון עד ' + heDate(st.nextRefresherDue) + '</span>';
  } else if (st.refresherOverdue) {
    details += '<span class="due">רענון עד <b>' + heDate(st.nextRefresherDue) + '</b></span>';
  }

  // Undo for a mistaken completion — individual/refresher rows only (a group
  // session is reopened from history by support, it affects everyone).
  if (st.lastDone && !inAlert) {
    const doneRow = sessions.find(h =>
      h.status === 'done' && L.sessionTypeOf(h) !== 'group' &&
      L.normalizeGuideName(h.guideName) === entry.name &&
      h.completedDate === st.lastDone);
    if (doneRow) {
      controls += '<button class="btn small danger-ghost" data-act="reopen" data-id="' +
        esc(doneRow.id) + '">בטל סימון</button>';
    }
  }

  return '<div class="row' + (st.overdue || st.refresherOverdue ? ' overdue' : '') + '">' +
    '<span class="gname">' + esc(entry.name) +
    ' <span class="gsub">' + esc(HOUSE_NAME[p.house] || p.house) + '</span></span>' +
    badges + due + details +
    '<span class="spacer"></span>' +
    '<span class="rowactions">' + controls + '</span>' +
    '</div>';
}

// Planned group sessions per cluster, with per-guide attendance marking.
function groupSessionsSection(entries) {
  const plannedGroups = sessions
    .filter(s => s.status === 'planned' && L.sessionTypeOf(s) === 'group')
    .sort((a, b) => String(a.scheduledDate || '').localeCompare(String(b.scheduledDate || '')));
  if (!plannedGroups.length) return '';

  let html = '<div class="section groups"><h2>הדרכות קבוצתיות מתוכננות <span class="count">' +
    plannedGroups.length + '</span></h2><div class="card">';
  plannedGroups.forEach(s => {
    const members = entries.filter(e =>
      e.role === 'guide' && e.person.active !== false &&
      L.clusterOfHouse(e.person.house) === s.cluster);
    const attending = L.attendanceList(s);
    html += '<div class="gsession" data-session="' + esc(s.id) + '">' +
      '<div class="ghead">' +
      '<span class="gtitle">' + esc(CLUSTER_LABEL[s.cluster] || s.cluster) + '</span>' +
      '<select data-act="supervisor" data-id="' + esc(s.id) + '">' +
        groupSupervisorOptions(s.supervisorId) + '</select>' +
      '<input type="date" value="' + esc(s.scheduledDate || '') +
        '" data-act="reschedule" data-id="' + esc(s.id) + '"/>' +
      '<span class="spacer"></span>' +
      '<button class="btn small done" data-act="complete" data-id="' + esc(s.id) +
        '" data-name="קבוצתית ' + esc(CLUSTER_LABEL[s.cluster] || s.cluster) + '">בוצע</button>' +
      '<button class="btn small danger-ghost" data-act="cancel" data-id="' + esc(s.id) + '">ביטול</button>' +
      '</div>' +
      '<div class="attend">' +
      members.map(m => {
        const on = attending.indexOf(m.name) >= 0;
        return '<label class="' + (on ? 'on' : '') + '"><input type="checkbox" value="' +
          esc(m.name) + '"' + (on ? ' checked' : '') + '/>' + esc(m.name) +
          ' <span class="gsub">' + esc(HOUSE_NAME[m.person.house] || '') + '</span></label>';
      }).join('') +
      '</div></div>';
  });
  html += '</div></div>';
  return html;
}

// Supervisors able to take an INDIVIDUAL session for this role, same-house
// first.
function supervisorOptions(selectedId, house, role, skipEmpty) {
  const capable = supervisors.filter(s =>
    s.active !== false && L.deliversIndividual(s) && L.supervisorCanRole(s, role));
  const same = capable.filter(s => L.supervisorCovers(s, house));
  const rest = capable.filter(s => !L.supervisorCovers(s, house));
  let html = skipEmpty ? '' : '<option value="">ללא מנחה</option>';
  same.concat(rest).forEach(s => {
    html += '<option value="' + esc(s.id) + '"' +
      (s.id === selectedId ? ' selected' : '') + '>' + esc(s.name) + '</option>';
  });
  return html;
}

function groupSupervisorOptions(selectedId) {
  const capable = supervisors.filter(s =>
    s.active !== false && L.deliversGroup(s) && L.supervisorCanRole(s, 'guide'));
  let html = '<option value="">ללא מנחה</option>';
  capable.forEach(s => {
    html += '<option value="' + esc(s.id) + '"' +
      (s.id === selectedId ? ' selected' : '') + '>' + esc(s.name) + '</option>';
  });
  return html;
}

function bindBoardEvents() {
  const root = document.getElementById('boardContent');
  root.querySelectorAll('[data-act=complete]').forEach(el => {
    el.onclick = () => openComplete({ hadrachaId: el.dataset.id, name: el.dataset.name });
  });
  root.querySelectorAll('[data-act=complete-direct]').forEach(el => {
    el.onclick = () => openComplete({ direct: { name: el.dataset.name, house: el.dataset.house } });
  });
  root.querySelectorAll('[data-act=reopen]').forEach(el => {
    el.onclick = () => doAction({ action: 'reopenHadracha', id: el.dataset.id }, 'הסימון בוטל');
  });
  root.querySelectorAll('[data-act=cancel]').forEach(el => {
    el.onclick = () => doAction({ action: 'cancelHadracha', id: el.dataset.id }, 'ההדרכה בוטלה');
  });
  root.querySelectorAll('[data-act=supervisor]').forEach(el => {
    el.onchange = () => doAction({
      action: 'updateHadracha', id: el.dataset.id,
      hadracha: { supervisorId: el.value },
    }, 'המנחה עודכן');
  });
  root.querySelectorAll('[data-act=reschedule]').forEach(el => {
    el.onchange = () => doAction({
      action: 'updateHadracha', id: el.dataset.id,
      hadracha: { scheduledDate: el.value },
    }, 'התאריך עודכן');
  });
  root.querySelectorAll('[data-act=assign]').forEach(el => {
    el.onchange = () => {
      if (!el.value) return;
      doAction({
        action: 'addHadracha',
        hadracha: {
          guideName: el.dataset.name,
          house: el.dataset.house,
          supervisorId: el.value,
          quarter: L.quarterOf(todayStr()),
          scheduledDate: todayStr(),
          type: 'individual',
        },
      }, 'ההדרכה שובצה');
    };
  });
  // Attendance — marked per guide on a group session.
  root.querySelectorAll('.gsession .attend input').forEach(cb => {
    cb.onchange = () => {
      const card = cb.closest('.gsession');
      cb.parentElement.classList.toggle('on', cb.checked);
      const names = Array.from(card.querySelectorAll('.attend input:checked')).map(x => x.value);
      doAction({ action: 'setAttendance', id: card.dataset.session, attendance: names },
        'הנוכחות עודכנה');
    };
  });
}

async function doAction(payload, okMsg) {
  try {
    await action(payload);
    toast(okMsg);
    await refreshData();
  } catch (e) {
    toast('שגיאה: ' + e.message);
  }
}

// ---- completion flow ----
function openComplete(ctx) {
  completingCtx = ctx;
  document.getElementById('completeWho').textContent =
    ctx.name || (ctx.direct && ctx.direct.name) || '';
  document.getElementById('completeDate').value = todayStr();
  document.getElementById('completeOverlay').classList.add('open');
}

async function confirmComplete() {
  const date = document.getElementById('completeDate').value;
  if (!L.isValidDate(date)) { toast('יש לבחור תאריך'); return; }
  const ctx = completingCtx;
  closeOverlays();
  try {
    if (ctx.hadrachaId) {
      await action({ action: 'completeHadracha', id: ctx.hadrachaId, completedDate: date });
    } else if (ctx.direct) {
      // Nothing planned — create then complete in two steps.
      const created = await action({
        action: 'addHadracha',
        hadracha: {
          guideName: ctx.direct.name,
          house: ctx.direct.house,
          supervisorId: '',
          quarter: L.quarterOf(date),
          scheduledDate: date,
          type: 'individual',
        },
      });
      await action({ action: 'completeHadracha', id: created.hadracha.id, completedDate: date });
    }
    toast('ההדרכה סומנה כבוצעה');
    await refreshData();
  } catch (e) {
    toast('שגיאה: ' + e.message);
  }
}

// ---- auto-scheduler — שבץ ----
let pendingSchedule = null;

function openSchedule() {
  if (people === null) { toast('אין נתוני צוות — לא ניתן לשבץ'); return; }
  const today = todayStr();
  const result = L.scheduleSessions({ people, supervisors, sessions, today });
  pendingSchedule = result;

  const summaryEl = document.getElementById('scheduleSummary');
  const listEl = document.getElementById('schedulePreview');
  const unEl = document.getElementById('scheduleUnassigned');
  const confirmBtn = document.getElementById('scheduleConfirm');

  if (!result.assignments.length && !result.unassigned.length) {
    summaryEl.textContent = 'כל אנשי הצוות הפעילים כבר משובצים';
    listEl.innerHTML = '';
    unEl.textContent = '';
    confirmBtn.disabled = true;
  } else {
    summaryEl.textContent = 'שיבוצים חדשים: ' + result.assignments.length;
    listEl.innerHTML = result.assignments.map(a => {
      let who;
      if (a.type === 'group') {
        who = 'קבוצתית · ' + esc(CLUSTER_LABEL[a.cluster] || a.cluster) +
          ' · ' + a.guideNames.length + ' מדריכים';
      } else if (a.type === 'refresher') {
        who = 'רענון · ' + esc(a.guideName);
      } else {
        who = esc(a.guideName) + ' · ' + esc(ROLE_LABEL[a.role] || a.role);
      }
      return '<div class="pitem"><span>' + who +
        (a.deadline ? ' <span class="badge new">עד ' + heDate(a.deadline) + '</span>' : '') +
        '</span><span class="pmeta">' + esc(supervisorName(a.supervisorId)) +
        ' · ' + heDate(a.scheduledDate) + '</span></div>';
    }).join('');
    unEl.textContent = result.unassigned.length
      ? 'ללא שיבוץ — אין מנחה מתאים או פנוי: ' +
        result.unassigned.map(u =>
          u.type === 'group' ? 'קבוצתית ' + (CLUSTER_LABEL[u.cluster] || u.cluster)
            : (u.type === 'refresher' ? 'רענון ' + u.guideName : u.guideName)
        ).join(', ')
      : '';
    confirmBtn.disabled = !result.assignments.length;
  }
  document.getElementById('scheduleOverlay').classList.add('open');
}

async function confirmSchedule() {
  const items = (pendingSchedule && pendingSchedule.assignments || []).map(a => ({
    guideName: a.guideName,
    house: a.house,
    supervisorId: a.supervisorId,
    quarter: a.quarter,
    scheduledDate: a.scheduledDate,
    type: a.type,
    cluster: a.cluster,
  }));
  closeOverlays();
  if (!items.length) return;
  try {
    const resp = await action({ action: 'addHadrachotBatch', items });
    toast('שובצו ' + resp.count + ' הדרכות');
    await refreshData();
  } catch (e) {
    toast('שגיאה: ' + e.message);
  }
}

// ---- supervisors screen ----
function renderSupervisors() {
  const el = document.getElementById('supList');
  if (!supervisors.length) {
    el.innerHTML = '<div class="loading">אין מנחים עדיין — הוסיפי מנחה ראשון</div>';
    return;
  }
  const today = todayStr();
  const quarter = L.quarterOf(today);
  el.innerHTML = supervisors.map(s => {
    const load = sessions.filter(h =>
      h.supervisorId === s.id && h.quarter === quarter && h.status !== 'cancelled').length;
    let caps = '';
    if (L.deliversGroup(s)) caps += '<span class="badge planned">קבוצתיות</span>';
    if (L.deliversIndividual(s)) caps += '<span class="badge planned">אישיות</span>';
    if (L.deliversRefresher(s)) caps += '<span class="badge refresher">רענונים</span>';
    const roles = L.supervisorRoles(s).map(r => ROLE_LABEL_PLURAL[r] || r).join(' · ');
    return '<div class="suprow' + (s.active === false ? ' off' : '') + '">' +
      '<span class="supname">' + esc(s.name) + '</span>' +
      '<span class="suphouses">' +
        (s.houses || []).map(h => esc(HOUSE_NAME[h] || h)).join(' · ') +
        '<br/><span class="gsub">' + esc(roles) + '</span></span>' +
      '<span class="supcaps">' + caps + '</span>' +
      '<span class="pill">ברבעון: <b>' + load + '</b> מתוך <b>' + esc(s.maxPerQuarter) + '</b></span>' +
      '<span class="rowactions">' +
      '<button class="btn small ghost" data-sup-edit="' + esc(s.id) + '">עריכה</button>' +
      '<button class="btn small danger-ghost" data-sup-toggle="' + esc(s.id) +
      '" data-active="' + (s.active === false ? 'true' : 'false') + '">' +
      (s.active === false ? 'הפעלה' : 'השבתה') + '</button>' +
      '</span></div>';
  }).join('');

  el.querySelectorAll('[data-sup-edit]').forEach(b => {
    b.onclick = () => openSupModal(b.dataset.supEdit);
  });
  el.querySelectorAll('[data-sup-toggle]').forEach(b => {
    b.onclick = () => doAction({
      action: 'setSupervisorActive',
      id: b.dataset.supToggle,
      active: b.dataset.active === 'true',
    }, 'עודכן');
  });
}

const CAPS = [
  { id: 'deliversGroup', name: 'הדרכות קבוצתיות' },
  { id: 'deliversIndividual', name: 'הדרכות אישיות' },
  { id: 'deliversRefresher', name: 'רענונים' },
];

function checkboxRow(el, items, isOn) {
  el.innerHTML = items.map(it => {
    const on = isOn(it.id);
    return '<label class="' + (on ? 'on' : '') + '"><input type="checkbox" value="' +
      it.id + '"' + (on ? ' checked' : '') + '/>' + esc(it.name) + '</label>';
  }).join('');
  el.querySelectorAll('input').forEach(cb => {
    cb.onchange = () => cb.parentElement.classList.toggle('on', cb.checked);
  });
}

function openSupModal(id) {
  editingSupId = id || null;
  const s = id ? supervisors.find(x => x.id === id) : null;
  document.getElementById('supModalTitle').textContent = s ? 'עריכת מנחה' : 'הוספת מנחה';
  document.getElementById('supName').value = s ? s.name : '';
  document.getElementById('supMax').value = s ? s.maxPerQuarter : 10;
  checkboxRow(document.getElementById('supHouses'),
    HOUSES.map(h => ({ id: h.id, name: h.name })),
    hid => !!(s && (s.houses || []).indexOf(hid) >= 0));
  checkboxRow(document.getElementById('supCaps'), CAPS, cid => {
    if (!s) return cid !== 'deliversRefresher';
    if (cid === 'deliversGroup') return L.deliversGroup(s);
    if (cid === 'deliversIndividual') return L.deliversIndividual(s);
    return L.deliversRefresher(s);
  });
  const roles = s ? L.supervisorRoles(s) : L.ROLES.slice();
  checkboxRow(document.getElementById('supRoles'),
    L.ROLES.map(r => ({ id: r, name: ROLE_LABEL_PLURAL[r] })),
    rid => roles.indexOf(rid) >= 0);
  document.getElementById('supOverlay').classList.add('open');
}

async function saveSupervisor() {
  const name = document.getElementById('supName').value.trim();
  const maxPerQuarter = Number(document.getElementById('supMax').value);
  const houses = Array.from(
    document.querySelectorAll('#supHouses input:checked')).map(cb => cb.value);
  const caps = Array.from(
    document.querySelectorAll('#supCaps input:checked')).map(cb => cb.value);
  const roles = Array.from(
    document.querySelectorAll('#supRoles input:checked')).map(cb => cb.value);
  if (!name) { toast('יש להזין שם'); return; }
  if (!houses.length) { toast('יש לבחור לפחות בית אחד'); return; }
  if (!roles.length) { toast('יש לבחור לפחות תפקיד אחד'); return; }
  if (!Number.isInteger(maxPerQuarter) || maxPerQuarter < 1) { toast('מקסימום לא תקין'); return; }
  const existing = editingSupId ? supervisors.find(x => x.id === editingSupId) : null;
  const supervisor = {
    name, houses, maxPerQuarter,
    active: existing ? existing.active !== false : true,
    deliversGroup: caps.indexOf('deliversGroup') >= 0,
    deliversIndividual: caps.indexOf('deliversIndividual') >= 0,
    deliversRefresher: caps.indexOf('deliversRefresher') >= 0,
    roles,
  };
  closeOverlays();
  try {
    if (editingSupId) {
      await action({ action: 'updateSupervisor', id: editingSupId, supervisor });
    } else {
      await action({ action: 'addSupervisor', supervisor });
    }
    toast('נשמר');
    await refreshData();
  } catch (e) {
    toast('שגיאה: ' + e.message);
  }
}

// ---- ui plumbing ----
function closeOverlays() {
  document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open'));
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function switchView(view) {
  currentView = view;
  document.getElementById('boardView').style.display = view === 'board' ? '' : 'none';
  document.getElementById('supervisorsView').style.display = view === 'supervisors' ? '' : 'none';
  document.querySelectorAll('.nav [data-view]').forEach(b => {
    b.classList.toggle('on', b.dataset.view === view);
  });
}

document.querySelectorAll('.nav [data-view]').forEach(b => {
  b.onclick = () => switchView(b.dataset.view);
});
document.getElementById('loginBtn').onclick = login;
document.getElementById('pinInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
document.getElementById('logoutBtn').onclick = logout;
document.getElementById('scheduleBtn').onclick = openSchedule;
document.getElementById('scheduleConfirm').onclick = confirmSchedule;
document.getElementById('completeConfirm').onclick = confirmComplete;
document.getElementById('addSupBtn').onclick = () => openSupModal(null);
document.getElementById('supSave').onclick = saveSupervisor;
document.querySelectorAll('[data-close]').forEach(b => { b.onclick = closeOverlays; });
document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) closeOverlays(); });
});

// ---- boot ----
// AUTH GATE: nothing but the PIN screen may appear before a VERIFIED
// session. A stored token is validated against GET /api/session first, and
// only a 200 opens the app — enterApp is the single place any view is shown
// or any data fetch starts. A missing, stale or forged token keeps the PIN
// screen up and clears the stored value; a network failure counts as
// unauthenticated (fail-closed), the PIN submit retries it.
async function boot() {
  document.getElementById('loginView').style.display = 'block';
  if (token) {
    let valid = false;
    try {
      const resp = await fetch('/api/session', {
        headers: { Authorization: 'Bearer ' + token },
      });
      valid = resp.ok;
    } catch (e) { valid = false; }
    if (valid) { enterApp(); return; }
    token = '';
    localStorage.removeItem('hadrachot_token');
  }
  document.getElementById('pinInput').focus();
}
boot();
</script>
